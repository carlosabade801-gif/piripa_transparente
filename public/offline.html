<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sem conexão — Piripá Transparente</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: #060F1E;
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .icon { font-size: 64px; margin-bottom: 24px; }
    h1 { font-size: 20px; font-weight: 900; margin-bottom: 8px; }
    p  { font-size: 14px; color: #94a3b8; line-height: 1.6; max-width: 280px; }
    button {
      margin-top: 24px;
      padding: 12px 24px;
      background: #06B6D4;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { background: #0891b2; }
  </style>
</head>
<body>
  <div class="icon">📡</div>
  <h1>Sem conexão</h1>
  <p>Você está offline. Conecte-se à internet para ver os dados mais recentes da prefeitura.</p>
  <p style="margin-top:12px;font-size:12px;color:#475569;">Os dados em cache ainda podem estar disponíveis.</p>
  <button onclick="window.location.reload()">Tentar novamente</button>
</body>
</html>
